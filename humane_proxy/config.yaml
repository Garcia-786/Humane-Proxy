# HumaneProxy — package default configuration.
# Users can override any value by placing a `humane_proxy.yaml` in their
# project directory, or by setting HUMANE_PROXY_* environment variables.

server:
  host: "0.0.0.0"
  port: 8000
  reload: false

# NOTE: `safety` and `escalation` are defined once each, further below.
# YAML silently keeps only the LAST duplicate top-level key, so never add
# a second block for an existing key.

heuristics:
  # Self-harm keywords — phrases that indicate self-harm ideation.
  self_harm_keywords:
    - "want to die"
    - "kill myself"
    - "end my life"
    - "suicide"
    - "suicidal"
    - "want to kill myself"
    - "can't go on"
    - "no reason to live"
    - "overdose on"
    - "slit my wrists"
    - "hang myself"
    - "cutting myself"
    - "hurt myself"
    - "self harm"
    - "self-harm"
    - "kill yourself"
    - "killing myself"
    - "starve myself"
    - "make myself throw up"

  # Criminal intent keywords — phrases indicating harmful criminal plans.
  criminal_keywords:
    - "how to make a bomb"
    - "how to build a bomb"
    - "how to poison someone"
    - "how to make poison"
    - "how to kill someone"
    - "how to get away with murder"
    - "how to make meth"
    - "how to synthesize fentanyl"
    - "how to cook meth"
    - "child pornography"
    - "child porn"
    - "explosive device"
    - "how to make ricin"

  # Score assigned per self-harm keyword match.
  self_harm_keyword_score: 0.7

  # Score assigned per criminal keyword match.
  criminal_keyword_score: 0.6

  # Score assigned when an intent pattern is detected.
  intent_pattern_score: 0.7

  # Context-reducing phrases that lower false positives.
  # Applied when all triggers stem from a single expression in the message
  # (overlapping matches); separate harmful expressions disable reduction.
  context_reducers:
    - "laughing"
    - "of laughter"
    - "of embarrassment"
    - "of boredom"
    - "in the game"
    - "in minecraft"
    - "for my character"
    - "in fiction"
    - "the villain"
    - "the character"
    - "in a novel"
    - "in a movie"
    - "in a book"
    - "in a story"
    - "my character"
    - "warning signs"
    - "prevent"
    - "prevention"
    - "how to help"
    - "help someone"
    - "help a friend"
    - "awareness"
    - "for a novel"
    - "for a movie"
    - "for a book"
    - "for a story"

trajectory:
  # Number of recent messages to evaluate for spike detection.
  window_size: 5

  # Delta threshold: if current_score - mean(last N) > spike_delta, flag it.
  spike_delta: 0.35

  # Exponential time-decay half-life (hours).
  # After this many hours, a historical score carries only 50 % of its
  # original weight in the rolling baseline.  This prevents stale data
  # from penalising returning users while still catching rapid escalation.
  #
  # Examples:
  #   24  → a score from yesterday has 50 % weight (default)
  #   6   → aggressive decay; only very recent history matters
  #   72  → gentle decay; multi-day memory
  #   0   → disable decay entirely (plain unweighted mean)
  decay_half_life_hours: 24.0

  # Where session trajectory state lives:
  #   "memory" — per-process dicts (default). With multiple uvicorn
  #              workers, each worker tracks sessions independently.
  #   "redis"  — shared Redis sorted sets with an atomic Lua
  #              read-append-trim, giving all workers one consistent
  #              view. Requires: pip install humane-proxy[redis].
  #              Falls back to "memory" (with a logged warning) if the
  #              redis package is missing or the server is unreachable.
  backend: "memory"
  redis:
    # Connection URL. Empty -> reuse storage.redis.url (share the
    # escalation store's Redis instance).
    url: ""
    key_prefix: "humane_proxy:traj:"
    # Per-session TTL in seconds; sessions idle longer than this expire
    # automatically (the Redis analogue of in-memory session eviction).
    # 0 -> auto: 2x decay half-life (min 1 hour), or 7 days when decay
    # is disabled.
    ttl_seconds: 0

# ---------------------------------------------------------------------------
# 3-Stage Cascade Pipeline (Phase 2)
# ---------------------------------------------------------------------------

pipeline:
  # Which stages to enable. [1] = heuristics only, [1,2] = +embeddings,
  # [1,2,3] = full pipeline with reasoning LLM.
  enabled_stages: [1]

  # Early-exit ceilings: if the combined score is below this after the
  # given stage AND category is "safe", skip remaining stages.
  stage1_ceiling: 0.3
  stage2_ceiling: 0.4

  # Fail-safe safety net: when Stage 3 is enabled, run it on messages that
  # Stages 1-2 marked safe. Embeddings score much criminal content near
  # zero, so this is where Stage 3 earns its keep. The default Stage-3
  # provider (OpenAI Moderation) is free, so this costs nothing there; set
  # false to restore the cost-saving early exit when using a paid provider.
  stage3_on_safe: true

stage2:
  # Embedding model name (resolved against the sentence-transformers
  # namespace on Hugging Face when no "/" is present).
  model: "all-MiniLM-L6-v2"

  # Calibration ceiling: raw cosine similarity in [safe_threshold,
  # score_ceiling] maps linearly onto [0, 1], so the escalation
  # thresholds (which were tuned to Stage-1 keyword scores) are
  # reachable by embeddings. Raw cosine for clearly harmful text tops
  # out around 0.55-0.65 with MiniLM-class models.
  score_ceiling: 0.65

  # Inference backend:
  #   "auto"                  — prefer ONNX Runtime when installed, else
  #                             sentence-transformers (default)
  #   "onnx"                  — ONNX Runtime only; no PyTorch needed.
  #                             Requires: pip install humane-proxy[onnx]
  #   "sentence-transformers" — PyTorch path.
  #                             Requires: pip install humane-proxy[ml]
  # Both backends produce numerically equivalent embeddings.
  backend: "auto"

  # Cosine similarity threshold: scores below this are "safe".
  safe_threshold: 0.35

  # Ambiguity dampening: when self-harm embedding score falls in this
  # band, benign anchors are also compared.  If benign semantics are
  # competitive (within ambiguity_margin), the score is halved.
  ambiguity_low: 0.30
  ambiguity_high: 0.55
  ambiguity_margin: 0.05

stage3:
  # Provider: "auto" | "openai_moderation" | "llamaguard" | "openai_chat" | "none"
  # "auto" checks OPENAI_API_KEY → openai_moderation, then GROQ_API_KEY → llamaguard.
  provider: "auto"

  # HTTP timeout for Stage-3 API calls (seconds).
  timeout: 10

  openai_moderation:
    api_url: "https://api.openai.com/v1/moderations"
    # omni-moderation-* emits illicit / illicit-violent categories that the
    # older text-moderation-* models lack (needed for criminal-intent).
    model: "omni-moderation-latest"

  llamaguard:
    api_url: "https://api.groq.com/openai/v1/chat/completions"
    model: "meta-llama/llama-guard-3-8b"

  # Any OpenAI-compatible chat endpoint (OpenAI, Groq, Together, a local
  # server). The key comes from OPENAI_API_KEY, else LLM_API_KEY.
  openai_chat:
    api_url: "https://api.openai.com/v1/chat/completions"
    model: "gpt-4o-mini"
    # Tokens for the model's reply. Reasoning models (e.g. Groq's
    # gpt-oss-safeguard) emit chain-of-thought before the JSON verdict and
    # need a generous budget — too small truncates the answer.
    max_tokens: 1024
    # JSON mode forces the whole reply to be one JSON value, which reasoning
    # models break. Off by default (a tolerant parser extracts the JSON from
    # free-form text). Enable for plain chat models that support it.
    json_mode: false

privacy:
  # If false (default), only a SHA-256 hash of the message is stored
  # in the escalation DB — never the raw text.
  store_message_text: false

# ---------------------------------------------------------------------------
# Phase 3 — Care Response & Category-Specific Behaviour
# ---------------------------------------------------------------------------

safety:
  # Criminal-intent escalation threshold. Scores at or above this trigger
  # escalation. Calibrated for the [0, 1] scale shared by Stage-1 keyword
  # scores and calibrated Stage-2 embedding scores (see stage2.score_ceiling).
  # 0.5 is the fail-safe default; raise toward 0.7 to reduce false positives
  # at the cost of recall.
  risk_threshold: 0.5
  spike_boost: 0.25
  session_history_limit: 20

  categories:
    self_harm:
      # Always notify the operator when self-harm is detected.
      always_escalate: true

      # Self-harm escalation threshold: embedding/pipeline scores at or above
      # this value trigger escalation.  Scores below are downgraded to safe.
      # Set lower for more aggressive catching, higher to reduce false positives.
      escalate_threshold: 0.5

      # "block"   (default / Mode B) — HumaneProxy itself replies with an
      #           empathetic message and international crisis resources.
      # "forward" (Mode A) — forward to the upstream LLM with a care-context
      #           system prompt injected before the user message.
      response_mode: "block"

      # Optional: override the default block message (leave empty to use built-in).
      block_message: ""

    criminal_intent:
      # Score threshold for escalation (below this → only log, no webhook).
      escalate_threshold: 0.65

      # Score threshold for blocking the request entirely.
      block_threshold: 0.80

# ---------------------------------------------------------------------------
# Storage Backend
# ---------------------------------------------------------------------------

storage:
  # "sqlite" (default, zero config) | "redis" | "postgres"
  backend: "sqlite"

  sqlite:
    # Path relative to CWD (or absolute).
    path: "escalations.db"

  redis:
    url: "redis://localhost:6379/0"
    key_prefix: "humane_proxy:"

  postgres:
    dsn: "postgresql://user:pass@localhost:5432/humane_proxy"
    pool_size: 5

# ---------------------------------------------------------------------------
# Admin API
# ---------------------------------------------------------------------------

admin:
  # Bearer token authentication for /admin/* routes.
  # Can also be set via: HUMANE_PROXY_ADMIN_KEY env var.
  # Leave empty to disable the admin API entirely.
  api_key: ""

# ---------------------------------------------------------------------------
# Extended Webhook Options (Phase 3)
# ---------------------------------------------------------------------------

escalation:
  # Per-session ALERT rate limiting. Every escalation is always written to
  # the audit log; this quota only caps operator notifications (webhooks,
  # email, CRITICAL log banner) per session per window.
  rate_limit_max: 3
  rate_limit_window_hours: 1

  webhooks:
    slack_url: ""
    discord_url: ""
    pagerduty_routing_key: ""

    # Microsoft Teams incoming webhook URL (adaptive card format).
    teams_url: ""

    # Email alert via SMTP (uses stdlib — no extra dependencies).
    email:
      # SMTP server settings
      host: ""
      port: 587
      use_tls: true
      username: ""
      password: ""
      from: ""
      # List of recipient addresses
      to: []

